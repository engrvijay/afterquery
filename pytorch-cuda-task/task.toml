version = "1.0"

[metadata]
name = "afterquery/pytorch-cuda-task"
author_name = "Vijay Gayee"
author_email = "vgayee@gmail.com"
difficulty = "medium"
category = "programming"
tags = ["H100", "benchmark", "GPU", "linux", "python", "pytorch", "cuda"]
gpu_types = ["H100"]
gpus = 1
paradigm = "optimization"
compute = "gpu"
