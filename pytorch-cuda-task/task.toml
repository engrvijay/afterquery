[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 7200.0

[task]
name = "afterquery/pytorch-cuda-task"
timeout_sec = 7200.0
description = "This is GPU tasks, do not excute/run on CPU, The verifier checks for the GPU.detect the GPU at runtime instead of assuming a specific model. Time GPU work with warmup, synchronization and repeated runs; report the median"

[environment]
workdir = "/workspace"
build_timeout_sec = 600.0
allow_internet = false

